# /etc/nginx/conf.d/sato-blog.conf
#
# 站点根目录指向 releases 里的软链接：发版只切符号链接，不覆盖正在被读的文件，
# 因此不会有「文件写一半被访问」的情况，回滚就是再切一次链接。
#
# 用法（没有备案、直接用 IP 访问也能跑）：
#   sudo cp scripts/deploy/nginx-sato-blog.conf /etc/nginx/conf.d/sato-blog.conf
#   sudo rm -f /etc/nginx/sites-enabled/default     # 让本配置成为 80 端口默认站点
#   sudo nginx -t && sudo systemctl reload nginx
#   浏览器打开 http://服务器IP:8081/ 即可（80 端口要备案后才能用域名访问）
#
# 有域名之后再：
#   sudo sed -i 's/server_name _;/server_name 你的域名;/' /etc/nginx/conf.d/sato-blog.conf
#   sudo certbot --nginx -d 你的域名
#
# 若 `nginx -t` 报 unknown directive "gzip_static"，说明这个 nginx 没编 gzip_static，
# 把 gzip_static 那行删掉即可（其余不受影响）；brotli_static 同理。

server {
    # 还没有备案 / 暂时用 IP 访问时：这两个 listen 让本 server 成为 80 端口的默认站点，
    # server_name 用 `_` 兜住任何 Host（IP、未知域名都能进来）。
    # ⚠️ 前提是不要再有别的默认站点，Ubuntu 自带的要删掉：
    #     sudo rm -f /etc/nginx/sites-enabled/default
    # 以后备案通过、域名可用时：把下面两行的 default_server 去掉，
    # server_name 换成你的域名（或保留 `_` 继续兜底），再加 443 的 server 块。
    # 没有备案时用 8081（80 端口留给备案后的域名访问）；
    # 备案通过后把 8081 改成 80，并去掉 default_server 冲突（删发行版默认站点即可）。
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name _;

    # 关键：指向 current 这个软链接，而不是某个具体 release 目录
    root /var/www/sato-blog/current;
    index index.html;
    charset utf-8;

    # ── 静态文件性能 ────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;          # 和 sendfile 一起用，少发小包
    tcp_nodelay on;
    keepalive_timeout 65;
    etag on;

    # 把打开过的文件元信息缓存住，大量小文件（分页文章、pagefind 索引）收益明显
    open_file_cache max=4096 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # 构建时已生成 .gz / .br（见 deploy-aliyun.yml 的 Precompress 步骤），
    # nginx 直接吐压缩好的文件，不做运行时压缩
    gzip_static on;
    # brotli_static on;   # 装了 brotli 模块再打开：apt install libnginx-mod-brotli

    # 兜底运行时 gzip（对没有 .gz 的动态/异常路径生效）
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── 缓存策略 ────────────────────────────────────────────────────
    # 带内容哈希的构建产物 → 永久缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 搜索索引：每次构建都会变，但文件名固定 → 一天
    location /pagefind/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # 页内图片 / 照片墙 / 音乐封面：换文件会换文件名，给 7 天
    location ~* ^/(wall|assets|images|pio)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # 音频：体积大，必须支持 Range（拖进度条），缓存给长一点
    location ~* ^/music/(audio|cover)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
        access_log off;
        try_files $uri =404;
    }

    # HTML 一律不缓存：发了新文章刷新就能看到
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 站点自带 404 页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ── HTTPS / HTTP2 ──────────────────────────────────────────────
    # 装完证书后 certbot 会自动补 443 server 块；也可以手动改成：
    # listen 443 ssl;
    # http2 on;                                    # nginx ≥ 1.25.1 的写法
    # ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_protocols TLSv1.2 TLSv1.3;
}
