# /etc/nginx/conf.d/sato-blog.conf
#
# 站点根目录指向 releases 里的软链接：发版只切符号链接，不覆盖正在被读的文件，
# 因此不会有「文件写一半被访问」的情况，回滚就是再切一次链接。
#
# 用法：
#   sudo cp scripts/deploy/nginx-sato-blog.conf /etc/nginx/conf.d/sato-blog.conf
#   sudo sed -i 's/blog.example.com/你的域名/g' /etc/nginx/conf.d/sato-blog.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS 建议交给 certbot（`sudo certbot --nginx -d 你的域名`），
# 它会自动补 443 server 块与证书续期。

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    # 关键：指向 current 这个软链接，而不是某个具体 release 目录
    root /var/www/sato-blog/current;
    index index.html;
    charset utf-8;

    # 静态站开 gzip 收益很大（HTML/CSS/JS/JSON 都能压到 20%~30%）
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 带内容哈希的构建产物 → 永久缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 页内图片 / 音乐 / 照片墙：文件名固定，换图会换文件名，给 7 天足够
    location ~* ^/(music/(audio|cover)|wall|assets|images|pio)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # 音乐音频体积大，支持 Range 才能拖进度条（nginx 默认支持，这里显式写出来）
    location ~* \.(mp3|m4a|flac|ogg|webm|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
    }

    # 搜索索引（Pagefind）不要命中 HTML 兜底逻辑
    location /pagefind/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML 一律不缓存：发了新文章刷新就能看到，避免 CDN/浏览器拿到旧页面
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 站点自带 404 页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 以后加 HTTPS 时把这一段一起放开
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
}
