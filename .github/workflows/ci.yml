name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: check, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      # 版本由 package.json 的 packageManager 字段决定
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm type-check
      - run: pnpm build
      - name: Verify build output
        run: |
          set -eu
          for path in \
            dist/index.html \
            dist/404.html \
            dist/posts/hello-world/index.html \
            dist/admin/publish/index.html \
            dist/rss.xml \
            dist/robots.txt \
            dist/sitemap-index.xml; do
            test -f "$path" || { echo "::error ::缺少构建产物 $path"; exit 1; }
          done
          echo "构建产物校验通过"

  # 可选：用 GitHub Actions 部署静态产物到 Cloudflare。
  #
  # 启用条件（仓库 Settings → Secrets and variables → Actions）：
  #   secrets.CLOUDFLARE_API_TOKEN   —— Workers Scripts: Edit + Account Settings: Read
  #   secrets.CLOUDFLARE_ACCOUNT_ID  —— 账户 ID
  #   vars.SITE_URL                  —— 站点正式地址（同时是这里的启用开关）
  #
  # 未设置 vars.SITE_URL 时这个 job 直接跳过，不会把 CI 弄红。
  deploy-cf:
    name: deploy (Cloudflare)
    runs-on: ubuntu-latest
    needs: [checks]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.SITE_URL != ''
    timeout-minutes: 25
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check required configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error ::缺少 secrets.CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error ::缺少 secrets.CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SITE_URL" || { echo "::error ::缺少 vars.SITE_URL"; exit 1; }
          echo "SITE_URL=$SITE_URL"
      - run: pnpm build
      # 部署 dist/ 到 Workers Assets（wrangler.jsonc 里配置）
      - run: npx wrangler deploy
      # 部署后自检。
      #
      # 注意：Cloudflare 的 Bot Fight Mode / 托管挑战会把数据中心 IP（Actions runner）
      # 拦成 403。这不代表部署失败，所以 403/429 只记 warning，5xx 与连接失败才算失败。
      - name: Smoke test deployment
        run: |
          set -u
          failed=0

          for path in / /archive/ /about/ /admin/publish/ /rss.xml /sitemap-index.xml /robots.txt; do
            code=""
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$SITE_URL$path" || true)
              [ "$code" = "200" ] && break
              case "$code" in 403|429) break ;; esac
              echo "  第 $attempt 次: $path -> $code，5 秒后重试"
              sleep 5
            done

            case "$code" in
              200) echo "OK   $path" ;;
              403|429)
                echo "::warning ::$path 返回 $code —— Cloudflare 安全策略拦住了 CI 出口 IP（浏览器访问不受影响），跳过"
                ;;
              *)
                echo "::error ::$path 返回 $code"
                failed=1
                ;;
            esac
          done

          # canonical 校验只在能取到页面时进行（被安全策略拦截时跳过）
          home_code=$(curl -s -o /tmp/home.html -w "%{http_code}" --max-time 20 "$SITE_URL/" || true)
          if [ "$home_code" = "200" ]; then
            canonical=$(grep -o 'rel="canonical"[^>]*' /tmp/home.html | head -1)
            echo "canonical: $canonical"
            case "$canonical" in
              *"$SITE_URL"*) echo "canonical 指向 SITE_URL ✓" ;;
              *) echo "::error ::canonical 未指向 SITE_URL（检查 siteConfig.site_url）"; failed=1 ;;
            esac
          else
            echo "::warning ::首页返回 $home_code，跳过 canonical 校验"
          fi

          exit "$failed"
