name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: format, lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      # webServer 直接跑 next start，因此需要先有生产构建
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 可选：用 GitHub Actions 部署静态产物到 Cloudflare。
  #
  # 启用条件（在仓库 Settings → Secrets and variables → Actions 里配）：
  #   secrets.CLOUDFLARE_API_TOKEN   —— Workers Scripts: Edit + Account Settings: Read
  #   secrets.CLOUDFLARE_ACCOUNT_ID  —— 账户 ID
  #   vars.SITE_URL                  —— 站点正式地址（也是这里的启用开关）
  #
  # 未设置 vars.SITE_URL 时这个 job 直接跳过，不会把 CI 弄红。
  deploy-cf:
    name: deploy (Cloudflare)
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SITE_URL != ''
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_URL: ${{ vars.SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Check required configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error ::缺少 secrets.CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error ::缺少 secrets.CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "SITE_URL=$SITE_URL"
      - run: npm run build
      # 部署 out/ 到 Workers Assets（wrangler.jsonc 里配置）
      - run: npx wrangler deploy
